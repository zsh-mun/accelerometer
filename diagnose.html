<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>传感器诊断</title>
<style>
  body { background:#111; color:#eee; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; padding:20px; }
  h3 { margin:0 0 12px; }
  .r { background:#1a1a1a; border:1px solid #333; border-radius:10px; padding:12px; margin:10px 0; word-break:break-all; font-size:15px; line-height:1.5; }
  .ok { color:#6ee7a0; }
  .no { color:#f28b82; }
  button { font-size:18px; padding:14px 22px; background:#1f5fa8; color:#fff; border:0; border-radius:10px; }
</style>
</head>
<body>
<h3>传感器诊断</h3>
<div class="r" id="ua">读取中…</div>
<div class="r" id="dm">检测中…</div>
<div class="r" id="req">检测中…</div>
<button id="go">点击测试权限</button>
<div class="r" id="result">还没测试</div>
<div class="r" id="data">（点上面的按钮，再看这里有没有数据）</div>
<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };

$("ua").textContent = "浏览器标识: " + navigator.userAgent;

var dm = typeof DeviceMotionEvent !== "undefined";
$("dm").innerHTML = "DeviceMotionEvent 接口: <span class='" + (dm ? "ok" : "no") + "'>" + (dm ? "存在" : "不存在（此浏览器不支持传感器）") + "</span>";

var req = dm && typeof DeviceMotionEvent.requestPermission === "function";
$("req").innerHTML = "requestPermission 接口: <span class='" + (req ? "ok" : "no") + "'>" + (req ? "存在（iOS 13+ 需要）" : "不存在（直接监听即可）") + "</span>";

var got = false;

function tryListen() {
  window.addEventListener("devicemotion", function (e) {
    got = true;
    var a = e.accelerationIncludingGravity;
    if (a) {
      $("data").textContent = "收到传感器数据: x=" + a.x.toFixed(2) + " y=" + a.y.toFixed(2) + " z=" + a.z.toFixed(2);
    } else {
      $("data").textContent = "收到事件，但含重力数据为 null";
    }
  }, true);
  setTimeout(function () {
    if (!got) $("data").textContent = "3 秒内没有收到任何传感器数据";
  }, 3000);
}

$("go").addEventListener("click", function () {
  $("result").textContent = "已点击，正在请求权限…";
  if (req) {
    DeviceMotionEvent.requestPermission().then(function (s) {
      $("result").textContent = "权限结果: " + s;
      if (s === "granted") tryListen();
    }).catch(function (err) {
      $("result").textContent = "权限请求出错: " + err.message;
    });
  } else {
    $("result").textContent = "没有 requestPermission，直接监听";
    tryListen();
  }
});
</script>
</body>
</html>
